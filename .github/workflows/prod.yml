
name: iOS CI/CD

on:
  push:
    branches: ["develop", "features/cicd"]

jobs:
  build:
    runs-on: macos-latest
    
    env:
      IOS_PROVISION_PROFILE: ${{ secrets.DEGREES_PROVISION_PROFILE }}
      IOS_CERTIFICATE: ${{ secrets.DEGREES_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.DEGREES_P12_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Use default Xcode
        run: |
          echo "Using default Xcode path:"
          xcode-select -p

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: yarn install

      - name: Run provisioning script
        run: make provision

      - name: Run sync script
        run: make sync
          
      - name: Build secrets - AWS Keys
        run: |
          yarn build-secrets "awsAccessKey=${{ secrets.AWS_ACCESS_KEY }}" "awsSecretKey=${{ secrets.AWS_SECRET_KEY }}"

      - name: Build secrets - Custom Push Domain
        run: |
          yarn build-secrets "customPushDomain=${{ secrets.CUSTOM_PUSH_DOMAIN }}"

      - name: Build secrets - Bugfender Key
        run: |
          yarn build-secrets "bugfenderKey=${{ secrets.BUGFENDER_KEY }}"


      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
        env:
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}

          
      - name: Debug certificate import
        run: |
          echo "$IOS_CERTIFICATE" | base64 --decode > certificate.p12
          ls -l certificate.p12
          file certificate.p12
          # Try importing with openssl
          openssl pkcs12 -in certificate.p12 -out certificate.pem -nodes || echo "OpenSSL failed"
          # Import using security tool (as fallback)
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign || echo "Security import failed"


  
      - name: Install signing certificate
        run: |
          # Check if the keychain exists and delete it if it does
          if security list-keychains | grep -q "build.keychain"; then
            echo "Keychain exists, deleting it..."
            security delete-keychain build.keychain
          fi
      
          # Create a new keychain
          security create-keychain -p "" build.keychain
      
          # Import the certificate into the new keychain
          echo "$IOS_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      
          # Set build.keychain as the default keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
        shell: /bin/bash -e {0}
        env:
          IOS_PROVISION_PROFILE: ***
          IOS_CERTIFICATE: ***
          IOS_CERTIFICATE_PASSWORD: ***


