
name: iOS CI/CD

on:
  push:
    # branches: ["develop", "features/cicd"]
    branches: ["features/cicd"]

jobs:
  build:
    runs-on: macos-latest
    
    env:
      IOS_PROVISION_PROFILE: ${{ secrets.DEGREES_PROVISION_PROFILE }}
      IOS_CERTIFICATE: ${{ secrets.DEGREES_CERTIFICATE_P12 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.DEGREES_P12_PASSWORD }}
      APP_NAME: Student
      BUNDLE_ID: com.instructure.icanvas.2u
      TEAM_ID: 58GH9WB284

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Set up Node.js
        uses: actions/setup-node@v4
        # with:
        #   node-version: 18

      # - name: Install Homebrew
      #   run: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install dependencies
        run: yarn install

      - name: Run provisioning script
        run: make provision

      - name: Run sync script
        run: make sync
          
      - name: Build secrets 
        run: |
          yarn build-secrets "awsAccessKey=${{ secrets.AWS_ACCESS_KEY }}" "awsSecretKey=${{ secrets.AWS_SECRET_KEY }}"
           yarn build-secrets "customPushDomain=${{ secrets.CUSTOM_PUSH_DOMAIN }}"
           yarn build-secrets "bugfenderKey=${{ secrets.BUGFENDER_KEY }}"

      - name: Use default Xcode
        run: |
          echo "Using default Xcode path:"
          xcode-select -p

      - name: Run Ruby script to disable signing
        run: ruby scripts/disable_auto_signing.rb
          
      # - name: Install provisioning profile
      #   run: |
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     echo "$IOS_PROVISION_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
      - name: Install provisioning 
        id: profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE" | base64 --decode > ~/profile.mobileprovision
  
          


          
      - name: Install signing certificate
        run: |
          echo "$IOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain


          

      - name: Verify code signing identities
        run: |
          echo "Listing available code signing identities..."
          security find-identity -v -p codesigning
          
      - name: List certificates in keychain
        run: security list-keychains && security show-keychain-info build.keychain
  
      - name: Check provisioning profile
        run: ls ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Show code signing identity
        run: security find-identity -v -p codesigning

      # - name: Build with Xcode
      #   run: |
      #     xcodebuild \
      #       -workspace Canvas.xcworkspace \
      #       -scheme Student \
      #       PROVISIONING_PROFILE_SPECIFIER="profile" \
      #       CODE_SIGN_IDENTITY="Apple Distribution: 2U, Inc. (58GH9WB284)" \
      #       clean build



      # - name: Clean Xcode build
      #   run: |
      #     xcodebuild clean -project Student/Student.xcodeproj \
      #                     -scheme Student \
      #                     -sdk iphoneos \
      #                     -configuration Release



      - name: Install provisioning profile
        id: provisioning
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          echo "$IOS_PROVISION_PROFILE" | base64 --decode > "$PROFILE_PATH"
          
          # Extract UUID from the profile
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          
          # Move the profile to the correct path with UUID name
          mv "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
      
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV


      - name: Archive iOS app using Xcode
        run: |
          xcodebuild archive \
            -workspace Canvas.xcworkspace \
            -scheme Student \
            -configuration Release \
            -archivePath ${{ github.workspace }}/build/Student.xcarchive \
            CODE_SIGN_IDENTITY="Apple Distribution: 2U, Inc. (${TEAM_ID})" \
            PROVISIONING_PROFILE=${{ env.PROFILE_UUID }} \
            DEVELOPMENT_TEAM=${TEAM_ID} \
            PRODUCT_BUNDLE_IDENTIFIER=${BUNDLE_ID} \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES


      - name: Export .ipa from archive (optional)
        run: |
          mkdir -p ${{ github.workspace }}/build/export
          xcodebuild -exportArchive \
            -archivePath ${{ github.workspace }}/build/Student.xcarchive \
            -exportPath ${{ github.workspace }}/build/export \
            -exportOptionsPlist exportOptions.plist

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Student.ipa
          path: build/export/*.ipa
          
      
      

