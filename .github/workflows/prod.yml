      - name: Clean up certificates and keychains
        if: always()
        run: |
          echo "=== Cleaning up certificates and keychains ==="
          
          # Delete the temporary keychain
          security delete-keychain build.keychain || true
          
          # Remove certificate files
          rm -f certificate.p12 || true
          rm -f exportOptions.plist || true
          
          # Remove provisioning profiles (optional)
          # rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
          
          # Reset keychain list to default
          security list-keychains -s login.keychain

            

